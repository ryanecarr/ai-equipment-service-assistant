# Agent version 5 sometimes returns equipment_model as null when the request names no
# model. That fails the schema; the application's corrective retry recovers it at the cost
# of a second agent call. Remove valid_schema from advisory once that is fixed, and it
# blocks again like every other case.
blocking:
  grounding_used: false
  cites_only_known_work_orders: true
  comparison_notes: absent
advisory:
  valid_schema: true
