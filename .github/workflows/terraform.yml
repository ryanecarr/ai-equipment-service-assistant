name: Terraform plan

# Shows the Terraform plan for infra/poc on a pull request. It is a preview: nothing is
# saved and nothing is applied. The plan that is applied is made on main by the Release
# workflow. infra/bootstrap (state storage and this pipeline's own identities) is applied
# by hand and is deliberately not run here.

on:
  pull_request:
    paths:
      - "infra/poc/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write # lets the job request an OIDC token to sign in to Azure

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # JSON list of object IDs, e.g. ["00000000-0000-0000-0000-000000000000"]
  TF_VAR_developer_principal_ids: ${{ secrets.DEVELOPER_PRINCIPAL_IDS }}

defaults:
  run:
    working-directory: infra/poc

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.17"

      - name: Format
        run: terraform fmt -check -recursive

      # backend.tf uses the Azure CLI session for local runs; here it uses OIDC instead.
      - name: Init
        run: terraform init -backend-config="use_cli=false" -backend-config="use_oidc=true"

      - name: Validate
        run: terraform validate

      # The plan identity is read-only, so it cannot take the state lock.
      - name: Plan
        run: terraform plan -lock=false
